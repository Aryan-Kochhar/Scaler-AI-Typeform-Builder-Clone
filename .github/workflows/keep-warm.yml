# Render's free tier sleeps after ~15 min without traffic, which makes the first
# request take ~50 s. Ping the health endpoint regularly so reviewers get a warm API.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health endpoint
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 120 https://aryan-typeform-clone-api.onrender.com/api/health
